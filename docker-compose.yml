services:
  redpanda-0:
    image: redpandadata/redpanda:latest
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda-0:9092,external://localhost:19092
      - --rpc-addr=redpanda-0:33145
      - --advertise-rpc-addr=redpanda-0:33145
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-0-data:/var/lib/redpanda/data

  redpanda-1:
    image: redpandadata/redpanda:latest
    container_name: redpanda-1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=1
      - --check=false
      - --seeds=redpanda-0:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19093
      - --advertise-kafka-addr=internal://redpanda-1:9092,external://localhost:19093
      - --rpc-addr=redpanda-1:33145
      - --advertise-rpc-addr=redpanda-1:33145
    ports:
      - "19093:19093"
      - "9645:9644"
    volumes:
      - redpanda-1-data:/var/lib/redpanda/data

  redpanda-2:
    image: redpandadata/redpanda:latest
    container_name: redpanda-2
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=2
      - --check=false
      - --seeds=redpanda-0:33145
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19094
      - --advertise-kafka-addr=internal://redpanda-2:9092,external://localhost:19094
      - --rpc-addr=redpanda-2:33145
      - --advertise-rpc-addr=redpanda-2:33145
    ports:
      - "19094:19094"
      - "9646:9644"
    volumes:
      - redpanda-2-data:/var/lib/redpanda/data

  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      - redpanda-0
      - redpanda-1
      - redpanda-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        BROKERS=redpanda-0:9092,redpanda-1:9092,redpanda-2:9092
        until rpk cluster info -X brokers=$$BROKERS | grep -q "redpanda-2"; do
          sleep 1
        done
        rpk topic create product-events \
          -X brokers=$$BROKERS \
          --partitions 6 \
          --replicas 3 \
          --if-not-exists

  redpanda-connect:
    image: docker.redpanda.com/redpandadata/connect:latest
    container_name: connect
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    command:
      - run
      - /connect/product-events.yaml
    volumes:
      - ./connect:/connect
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d

  postgres:
    image: postgres:17-alpine
    container_name: financial-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_agent
      POSTGRES_USER: financial_agent
      POSTGRES_PASSWORD: financial_agent_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_agent -d financial_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redpanda-0-data:
  redpanda-1-data:
  redpanda-2-data:
  clickhouse-data:
  postgres_data:
